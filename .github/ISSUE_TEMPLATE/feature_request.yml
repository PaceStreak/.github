name: Feature request
description: Suggest something PaceStreak should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PaceStreak is opinionated: it rewards showing up, never doing more, and
        it never shows anyone's habits to anyone else. Requests that reward
        volume, body weight or calories, or that would make a habit visible to
        others, will be declined on those grounds rather than on merit.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the feature you imagine. The best solution is often not the one first suggested.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Existing workarounds tell us how much this actually hurts.
